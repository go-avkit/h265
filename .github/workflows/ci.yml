name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every job installs the Go release that go.mod names (go-version-file), so the
# floor and the CI toolchain cannot drift apart: no second pin to move.
# The H.265.1 conformance streams are not committed. Under CI=true the tests that
# read them FAIL when H265_CONFORMANCE_DIR is unset, unless a lane says it does
# not carry the corpus with H265_CONFORMANCE_SKIP_OK=1 (every lane but the
# conformance job below, which is where the oracle is read).
env:
  H265_CONFORMANCE_SKIP_OK: '1'

jobs:
  # Fetch the H.265.1 (HEVC_v1) and RExt conformance zips named by the pin
  # manifests, verify every bitstream and trace by SHA-256, and run the tests that
  # compare against them: every SPS and PPS of the suite, and the HM traces. A
  # missing directory or a hash that differs fails the job; the tests do not skip.
  conformance:
    runs-on: ubuntu-latest
    env:
      H265_CONFORMANCE_SKIP_OK: '0'
      H265_CONFORMANCE_DIR: ${{ github.workspace }}/.conformance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: .conformance
          key: h265-conformance-${{ hashFiles('testdata/conformance.sha256', 'testdata/conformance-rext.sha256') }}
      - name: fetch and verify HEVC_v1
        run: >
          go run ./testdata/fetchconformance -dir .conformance
          -base https://www.itu.int/wftp3/av-arch/jctvc-site/bitstream_exchange/draft_conformance/HEVC_v1
          -manifest testdata/conformance.sha256
      - name: fetch and verify RExt
        run: >
          go run ./testdata/fetchconformance -dir .conformance
          -base https://www.itu.int/wftp3/av-arch/jctvc-site/bitstream_exchange/draft_conformance/RExt
          -manifest testdata/conformance-rext.sha256
      - name: conformance tests
        run: go test -count=1 -v -run 'Conformance|Traces' . > conformance.log 2>&1 || { cat conformance.log; exit 1; }
      # A run that executed nothing would be green: name the passes.
      - name: the tests ran
        run: |
          for t in TestEverySPSOfTheConformanceSuiteParses TestSPSAgainstTheTraces TestEveryPPSOfTheConformanceSuiteParses TestPPSAgainstTheTraces TestEverySliceHeaderOfTheConformanceSuite TestEverySliceDataOfTheConformanceSuiteEndsOnItsLastBit; do
            grep -q -- "--- PASS: $t" conformance.log || { echo "::error::$t did not pass"; exit 1; }
          done
          # ... and the counts they printed: the streams and sets the suite holds.
          for c in "sps streams=196" "sps-trace streams=27" "pps-trace streams=27" "pps sets=1310 validated=1281" "slices=52215 refused=56 traced=7580 fields=66597 lengths=7580 subsets=20716" "walk slices=52215 failed=0 refused=56 units=16605173 transform-units=20469205 blocks=23674541 pcm=11207 entry-points=7558"; do
            grep -F -- "conformance-count: $c" conformance.log || { echo "::error::no 'conformance-count: $c' line"; exit 1; }
          done

  # Every file must be gofmt-clean.
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

  # Build, vet, race-test, and enforce 100% statement coverage on three OSes.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          go test -race -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 25
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  # Run the suite on the six supported 64-bit targets. amd64/arm64 run natively;
  # the rest run under qemu-user. A bitstream reader takes multi-byte fields apart
  # by hand, so this is also the big-/little-endian correctness gate (s390x is
  # big-endian).
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go env GOARCH && go test ./...

  # The one 32-bit target. 386 runs natively on the amd64 runner, without qemu,
  # and it is where int and uint are 32 bits wide: a length converted to int
  # before it is compared, or a sum done in uint, wraps only here. The L8
  # security audit (go-avkit/avkit#54) found five of its eight defects on 32-bit
  # targets alone, none of which the 64-bit lanes could see. Coverage is gated
  # on the 64-bit lanes; this one only vets and tests.
  arch-386:
    name: arch 386
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: GOARCH=386 go vet ./...
      - run: GOARCH=386 go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      - name: Test under qemu (${{ matrix.goarch }})
        run: |
          base="${{ matrix.qemu }}"
          q=""
          for cand in "$base" "${base%-static}"; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          # ⛔ A missing emulator FAILS this lane. A lane that reports success for
          # an architecture it never ran is the one outcome this matrix exists to
          # rule out.
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for ${{ matrix.goarch }} (looked for $base and ${base%-static})"
            exit 1
          fi
          # Printed on purpose: without it, "ran under emulation" and "skipped" are
          # indistinguishable from a green tick.
          echo "running ${{ matrix.goarch }} under $q"
          GOARCH=${{ matrix.goarch }} go test -exec="$q" ./...
